name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run build

      # DataGridWidget._esm points at the bundle above, so the package cannot be
      # imported until it exists.  Without this, nothing verified uv.lock at all.
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag is published
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python -c "from data_grid import DataGridWidget; DataGridWidget(table='t', db='d')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/data_grid/static

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        
